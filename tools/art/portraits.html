<html><body style="margin:0;background:transparent"><canvas id="c" width="144" height="168"></canvas><script>
// Original pixel portraits for Shadow Fleet (24x28 grid, 6x scale). No likenesses.
const W = 24, H = 28;
function blank() { return Array.from({length: H}, () => Array(W).fill(null)); }
function px(g, x, y, c) { if (x >= 0 && x < W && y >= 0 && y < H) g[y][x] = c; }
function rect(g, x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) px(g, x, y, c); }
function ell(g, cx, cy, rx, ry, c, yMin = -1, yMax = 99) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
    if (dx * dx + dy * dy <= 1 && y >= yMin && y <= yMax) g[y][x] = c;
  }
}
function outline(g, k) {
  const o = g.map(r => r.slice());
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (g[y][x]) continue;
    const n = [[1,0],[-1,0],[0,1],[0,-1]].some(([a,b]) => g[y+b] && g[y+b][x+a]);
    if (n) o[y][x] = k;
  }
  return o;
}
function head(g, skin, shade) {
  ell(g, 12, 14, 6, 7.5, skin);
  for (let y = 0; y < H; y++) for (let x = 16; x < W; x++) if (g[y][x] === skin) g[y][x] = shade;  // light from the left
  rect(g, 10, 20, 13, 22, shade);  // neck
}
function torso(g, c, c2) { ell(g, 12, 30, 11, 7.5, c, 22); for (let y = 22; y < H; y++) for (let x = 16; x < W; x++) if (g[y][x] === c) g[y][x] = c2; }
function eyes(g, c, y = 14) { px(g, 9, y, c); px(g, 14, y, c); }

const g = FACES[location.hash.slice(1)]();
